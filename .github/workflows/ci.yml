name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: el job solo lee el código. Sin esto, el token hereda permisos de
# escritura sobre el repo y cualquier step comprometido podría pushear.
permissions:
  contents: read

concurrency:
  # Un push nuevo cancela la corrida anterior de la misma rama/PR.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pineadas por SHA COMPLETO, no por tag: un tag es mutable y quien controle
      # el repo de la action puede reapuntarlo a código malicioso. El comentario deja
      # legible qué versión es cada SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice el lock file y falla
      # si package.json y el lock divergen.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Antes del audit porque es la red que cubre las reglas de negocio: si una se rompio,
      # queremos verlo antes que un advisory de dependencias.
      - name: Tests
        run: npm test

      # Backstop de dependencias: un advisory nuevo se ve el día que sale y no meses después
      # (fue exactamente lo que pasó: 29 advisories de Next acumulados en silencio).
      #
      # HOY ESTE STEP FALLA, y no por nada que se haya agregado acá: son 20 advisories
      # acumulados (12 moderate, 7 high, 1 critical) que ya estaban en main. El critical es
      # GHSA-p293-qw3h-jr36 (RCE sin autenticar en Next sobre Windows) y afecta a todo next
      # <= 16.3.0-preview.10, asi que salir de ahi es un major: next 15 -> 16. Queda como
      # tarea aparte; bajar el audit-level para pintar el CI de verde seria taparlo.
      - name: Audit de dependencias
        run: npm audit --audit-level=high

      # Último porque es el más lento: si algo más simple ya falló, no gastamos el build.
      - name: Build
        run: npm run build
