name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: el job solo lee el código. Sin esto, el token hereda permisos de
# escritura sobre el repo y cualquier step comprometido podría pushear.
permissions:
  contents: read

concurrency:
  # Un push nuevo cancela la corrida anterior de la misma rama/PR.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pineadas por SHA COMPLETO, no por tag: un tag es mutable y quien controle
      # el repo de la action puede reapuntarlo a código malicioso. El comentario deja
      # legible qué versión es cada SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice el lock file y falla
      # si package.json y el lock divergen.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Antes del audit porque es la red que cubre las reglas de negocio: si una se rompio,
      # queremos verlo antes que un advisory de dependencias.
      - name: Tests
        run: npm test

      # Los criterios de aceptación de docs/requisitos citan el test que los verifica. Esto
      # falla si una cita quedó apuntando a un test que ya no existe, que es lo que convierte
      # al directorio en documentación viva en vez de un archivo que envejece solo.
      # Va después de los tests: si la suite está rota, eso se ve primero.
      - name: Trazabilidad de requisitos
        run: npm run trazabilidad

      # Backstop de dependencias: un advisory nuevo se ve el día que sale y no meses después
      # (fue exactamente lo que pasó: 29 advisories de Next acumulados en silencio).
      #
      # La vara sigue en high. Lo que cambió es que ahora pasa por scripts/auditoria-deps.mjs
      # en vez de `npm audit --audit-level=high` pelado, porque salió un caso que el comando
      # pelado no sabe manejar: un advisory sin versión parcheada (GHSA-fc5q-39xc-vjpf en
      # picomatch, rango vulnerable '*'). Con el comando pelado las únicas salidas eran bajar
      # la vara —que tapa todos los high futuros, no solo ese— o poner `|| true`, que vuelve
      # al step decoración. El script deja permitir advisories de a uno, con el motivo escrito
      # y una fecha de revisión, y falla igual con cualquier otro high o critical, con los
      # permisos vencidos, y con los permisos que ya no corresponden.
      - name: Audit de dependencias
        run: npm run auditoria-deps

      # Último porque es el más lento: si algo más simple ya falló, no gastamos el build.
      - name: Build
        run: npm run build
