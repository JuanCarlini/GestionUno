name: Monitoreo sintético

# Chequea cada 15 minutos que producción conteste. No reemplaza a un uptime monitor de
# verdad, pero cuesta cero y cubre el caso que más duele: la app caída un domingo y nadie
# enterándose hasta el lunes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Sin checkout: el job es un curl. Clonar el repo para esto son segundos tirados cada
      # 15 minutos.
      - name: GET /api/health
        id: health
        run: |
          set -o pipefail
          URL="${{ vars.PRODUCCION_URL }}/api/health"

          # --max-time 5: el umbral del plan. Una app que tarda más de 5 s en decir "estoy
          # viva" está rota para el usuario, aunque termine respondiendo 200.
          # -w: el status y el tiempo salen por stdout, el cuerpo a un archivo.
          codigo=$(curl --silent --show-error --max-time 5 \
                        --output respuesta.json \
                        --write-out '%{http_code} %{time_total}' \
                        "$URL") || {
            echo "curl falló (timeout o conexión): $URL"
            exit 1
          }

          estado=$(echo "$codigo" | cut -d' ' -f1)
          tiempo=$(echo "$codigo" | cut -d' ' -f2)
          echo "status=$estado en ${tiempo}s"
          echo "cuerpo: $(cat respuesta.json)"

          if [ "$estado" != "200" ]; then
            # /api/health devuelve 503 con el detalle de qué dependencia falló.
            echo "::error::El health check devolvió $estado: $(cat respuesta.json)"
            exit 1
          fi

      - name: Avisar si está caída
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const cuerpo = [
              `El health check de producción falló.`,
              ``,
              `- Corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Hora: ${new Date().toISOString()}`,
              ``,
              `/api/health responde 503 con el detalle de qué dependencia falló (db o storage),`,
              `o no responde en 5 segundos.`,
            ].join("\n")

            // Un issue por incidente, no uno cada 15 minutos: mientras siga caída, se comenta.
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "caida",
            })

            if (abiertos.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: abiertos.data[0].number,
                body: cuerpo,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Producción no responde (${new Date().toISOString().slice(0, 16).replace("T", " ")})`,
                body: cuerpo,
                labels: ["caida"],
              })
            }

# ---------------------------------------------------------------------------------------
# CÓMO REEMPLAZARLO POR n8n CON AVISO A WHATSAPP
#
# Este workflow tiene dos límites: GitHub no garantiza la puntualidad de los cron (bajo carga
# los difiere, y los de */15 son los primeros en sufrirlo), y el aviso llega como issue, que
# nadie mira un domingo. Para que avise de verdad:
#
# 1. En n8n, un workflow con:
#      Schedule Trigger   → cada 5 minutos (n8n sí respeta el intervalo)
#      HTTP Request       → GET https://<produccion>/api/health
#                           Timeout 5000 ms, "Never Error" activado para poder leer el status
#      IF                 → {{ $json.statusCode }} equals 200  AND  {{ $json.body.ok }} is true
#      (rama falsa) →  WhatsApp Business Cloud  → mensaje al número de guardia
#
# 2. El mensaje conviene que diga qué dependencia falló, que el health ya lo dice:
#      "Gestión Uno caída: db={{ $json.body.db }} storage={{ $json.body.storage }}"
#
# 3. Para no mandar 12 mensajes por hora mientras dura la caída, poner un nodo de estado
#    (Data Table o Redis) con el último estado conocido, y avisar solo en los cambios:
#    verde→rojo ("se cayó") y rojo→verde ("volvió").
#
# 4. Una vez que n8n esté avisando, este workflow se borra: dos monitoreos que avisan lo
#    mismo terminan en que se ignoran los dos.
#
# La URL de producción sale de la variable PRODUCCION_URL del repo (Settings → Secrets and
# variables → Actions → Variables), no de un secret: no es secreta y verla en el log ayuda.
# ---------------------------------------------------------------------------------------
